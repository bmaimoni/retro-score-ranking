<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Jogos — Retro Score Ranking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-common.css">
  <style>
    /* docs/PAINEIS_ADMIN_SPEC.md §9/§10, docs/CATALOGO_JOGOS_SPEC.md Fase 7 —
       canto "Jogos": busca lidera (catálogo local + IGDB, com filtro de
       gênero/geração), vínculo a Arena/evento vem depois de achar o jogo,
       não antes. Reordenado a partir de feedback de uso real do Bruno —
       antes exigia escolher event primeiro pra poder buscar qualquer coisa. */
    .admin-page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      padding-right: calc(var(--space-lg) + 44px + var(--space-md));
      background: var(--color-bg-surface);
      border-bottom: var(--border-width) solid var(--color-border);
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .topbar-brand { display: flex; align-items: center; gap: var(--space-sm); }
    .topbar-logo { height: 28px; width: auto; object-fit: contain; }
    .topbar-title { font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-primary); letter-spacing: 0.08em; }
    .topbar-right { display: flex; align-items: center; gap: var(--space-md); }

    .conteudo { padding: var(--space-lg); max-width: 900px; margin: 0 auto; width: 100%; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); gap: var(--space-md); flex-wrap: wrap; }
    .section-title { font-size: var(--text-lg); font-weight: var(--weight-bold); color: var(--color-text); }

    .games-grid { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-xl); }
    .game-card {
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-md);
      align-items: center;
    }
    .game-card.inativo { opacity: 0.5; }
    .game-nome { font-size: var(--text-md); font-weight: var(--weight-bold); }
    .badge-pendente-game {
      display: inline-block;
      font-size: 10px;
      font-weight: var(--weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--color-warning, #e6a23c);
      color: #1a1a1a;
      padding: 2px 8px;
      border-radius: var(--radius-full, 999px);
      margin-left: 8px;
      vertical-align: middle;
    }
    .game-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
    .game-actions { display: flex; gap: var(--space-xs); align-items: center; }

    .toggle-ativo {
      width: 44px; height: 24px;
      border-radius: var(--radius-full);
      background: var(--color-bg-surface2);
      border: var(--border-width) solid var(--color-border);
      cursor: pointer;
      position: relative;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .toggle-ativo.on { background: var(--color-secondary); border-color: var(--color-secondary); }
    .toggle-ativo::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform var(--transition);
    }
    .toggle-ativo.on::after { transform: translateX(20px); }

    .btn-action {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all var(--transition);
      border: var(--border-width) solid transparent;
      white-space: nowrap;
    }
    .btn-ocultar  { background: rgba(240,64,96,0.12); color: var(--color-error); border-color: rgba(240,64,96,0.3); }
    .btn-ocultar:hover  { background: rgba(240,64,96,0.25); }
    .btn-reativar { background: rgba(95,187,80,0.12); color: var(--color-success); border-color: rgba(95,187,80,0.3); }
    .btn-reativar:hover { background: rgba(95,187,80,0.25); }

    .caixa-form {
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .form-title { font-size: var(--text-md); font-weight: var(--weight-bold); margin-bottom: var(--space-md); color: var(--color-secondary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .busca-filtros { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin: var(--space-sm) 0; }
    .busca-filtros select {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      background: var(--color-bg);
      color: var(--color-text);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
    }
    .resultados-grupo-titulo {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: var(--space-md) 0 var(--space-xs);
    }
    .resultado-card {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: var(--border-width) solid var(--color-border);
    }
    .resultado-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .badge-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-full, 999px);
      background: var(--color-bg-surface2);
      color: var(--color-text-muted);
    }

    .empty-admin { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--color-text-muted); }
    .empty-admin-icon { font-size: 48px; margin-bottom: var(--space-md); }
    .empty-admin-text { font-size: var(--text-md); font-weight: var(--weight-bold); color: var(--color-text-dim); }

    #jogos-loading { text-align: center; padding: var(--space-2xl); color: var(--color-text-muted); }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="jogos-loading">Carregando…</div>

<div class="admin-page" id="pagina" style="display:none">
  <div class="admin-topbar">
    <span class="topbar-brand">
      <img src="logo.png" alt="" class="topbar-logo">
      <span class="topbar-title">JOGOS</span>
    </span>
    <div class="topbar-right">
      <div id="arena-selector"></div>
      <div id="event-selector"></div>
    </div>
  </div>

  <div class="conteudo">
    <div id="jogos-sem-arena" style="display:none;color:var(--color-text-muted);font-size:var(--text-sm)">
      Você ainda não administra nenhuma Arena.
      <a href="admin.html" style="color:var(--color-primary)">Voltar ao painel</a>
    </div>

    <!-- Busca lidera a tela — funciona com ou sem event escolhido.
         Só o VÍNCULO a um event exige ter um selecionado (games-list
         abaixo, do event ativo, existe independente disso). -->
    <div id="busca-secao" style="display:none">
      <div class="caixa-form">
        <p class="form-title">Buscar jogo</p>
        <input class="field-input" type="search" id="busca-input" placeholder="Nome do jogo (ex: Street Fighter)…">
        <div class="busca-filtros">
          <select id="filtro-genero"><option value="">Gênero: qualquer</option></select>
          <select id="filtro-geracao"><option value="">Geração: qualquer</option></select>
        </div>

        <p class="game-meta" id="sem-event-hint" style="display:none">
          Selecione um event no topo pra vincular o jogo escolhido — a busca funciona sem isso, só o vínculo espera.
        </p>

        <div id="resultados-catalogo"></div>
        <div id="resultados-igdb"></div>
        <p class="game-meta" id="credito-igdb" style="display:none;font-size:var(--text-xs);opacity:0.7;margin-top:var(--space-sm)">
          Dados de jogos fornecidos por IGDB.com
        </p>

        <button class="btn-action btn-ocultar" id="manual-toggle-btn" style="margin-top:var(--space-md)">Não encontrei — cadastro manual</button>
        <div id="manual-form" style="display:none;margin-top:var(--space-md)">
          <div class="form-row">
            <div class="field">
              <label class="field-label" for="manual-nome">Nome</label>
              <input class="field-input" type="text" id="manual-nome" placeholder="Ex: Pac-Man">
            </div>
            <div class="field">
              <label class="field-label" for="manual-slug">Slug (URL)</label>
              <input class="field-input" type="text" id="manual-slug" placeholder="Ex: pac-man">
            </div>
          </div>
          <div class="field" style="margin-top:var(--space-sm)">
            <label class="field-label" for="manual-plataforma">Plataforma (opcional)</label>
            <input class="field-input" type="text" id="manual-plataforma" placeholder="Ex: Arcade">
          </div>
          <div class="field" style="margin-top:var(--space-sm)">
            <label class="field-label" for="manual-score-max">Score máximo (opcional)</label>
            <input class="field-input" type="number" id="manual-score-max" placeholder="Deixe vazio para sem limite">
          </div>
          <button class="btn-primary" id="manual-criar-btn" style="margin-top:var(--space-md)">CADASTRAR JOGO</button>
        </div>
      </div>
    </div>

    <div id="jogos-conteudo" style="display:none">
      <div class="section-header">
        <span class="section-title">Jogos deste event</span>
      </div>
      <div class="games-grid" id="games-list"></div>
    </div>
  </div>
</div>

<script type="module">
import {
  exigirAdmin, apiFetch, escapar, showToast, emptyState,
  inicializarArenaAtiva, getArenaAtual, onArenaChange, eventosDaArenaAtiva,
  nivelNaArena, getMeInfo, montarDropdownPill,
} from './admin-common.js';
import { inserirNav } from './nav.js';

inserirNav('jogos');

// docs/PAINEIS_ADMIN_SPEC.md §10 (Fase V) — 400ms original ficava curto
// pra digitação normal, aumentado pra dar mais tempo antes de disparar
// a busca de rede (a busca local no catálogo já é instantânea, não
// precisa de debounce — só a chamada IGDB é debounced).
const DEBOUNCE_MS = 600;

let eventoAtual       = null;
let jogosCache         = [];
let catalogoCache      = null;
let igdbIndisponivel   = false;
let igdbDebounceTimer  = null;

(async () => {
  const meInfo = await exigirAdmin();
  if (!meInfo) return; // exigirAdmin já redirecionou pra admin.html

  document.getElementById('jogos-loading').style.display = 'none';
  document.getElementById('pagina').style.display = 'grid';

  await inicializarArenaAtiva(document.getElementById('arena-selector'));

  if (!getArenaAtual()) {
    document.getElementById('jogos-sem-arena').style.display = 'block';
    return;
  }

  await carregarCatalogo();
  popularFiltros();
  ligarBusca();
  atualizarVisibilidadeBusca();

  onArenaChange(() => { atualizarVisibilidadeBusca(); popularSeletorEvento(); });
  await popularSeletorEvento();
})();

// Moderador só lê — leitura de games do event já é liberada pro
// moderador no backend (docs/PERMISSOES_SPEC.md §7 item 5). A seção de
// busca inteira (que só serve pra criar/vincular) fica escondida pra
// quem não edita, mesmo padrão de antes.
function podeEditar() {
  const meInfo = getMeInfo();
  if (!meInfo) return false;
  return meInfo.super || nivelNaArena(getArenaAtual()) === 'admin';
}

function atualizarVisibilidadeBusca() {
  document.getElementById('busca-secao').style.display = podeEditar() ? 'block' : 'none';
}

async function popularSeletorEvento() {
  const container = document.getElementById('event-selector');
  const meInfo = getMeInfo();
  let eventos;

  if (meInfo.super) {
    try {
      const resp = await apiFetch('/api/admin/events');
      eventos = resp.ok ? (await resp.json()).filter(e => e.arena_id === getArenaAtual()) : [];
    } catch { eventos = []; }
  } else {
    eventos = eventosDaArenaAtiva() || [];
  }

  if (eventos.length === 0) {
    container.innerHTML = '';
    document.getElementById('sem-event-hint').style.display = 'block';
    document.getElementById('jogos-conteudo').style.display = 'none';
    eventoAtual = null;
    jogosCache  = []; // sem event, nada está "já vinculado" pra filtrar
    renderResultadosCatalogo(); // reflete a falta de event nos botões
    return;
  }

  document.getElementById('sem-event-hint').style.display = 'none';
  document.getElementById('jogos-conteudo').style.display = 'block';

  if (!eventoAtual || !eventos.some(e => e.id === eventoAtual)) eventoAtual = eventos[0].id;

  montarDropdownPill(container, {
    itens: eventos,
    valorAtual: eventoAtual,
    onChange: (id) => { eventoAtual = id; carregarJogos(); renderResultadosCatalogo(); },
    renderPill: pillEvento,
    renderItem: pillEvento,
  });

  await carregarJogos();
}

function pillEvento(e) {
  return `<span>${escapar(e.nome)}${e.ativo === false ? ' (arquivado)' : ''}</span>`;
}

// ── LISTA DE JOGOS DO EVENT (mesma fonte de admin.html, Fase I) ────────────
async function carregarJogos() {
  if (!eventoAtual) return;
  try {
    const resp = await apiFetch(`/api/admin/events/${eventoAtual}/games`);
    if (!resp.ok) { document.getElementById('games-list').innerHTML = emptyState('Erro ao carregar jogos deste event'); return; }
    renderJogos(await resp.json());
  } catch { /* silencioso */ }
}

function badgesMetadado(g) {
  const generos  = (g.generos  || []).map(x => `<span class="badge-tag">${escapar(x)}</span>`);
  const geracoes = (g.geracoes || []).map(x => `<span class="badge-tag">${x}ª ger.</span>`);
  const tudo = [...generos, ...geracoes].join('');
  return tudo ? `<div class="resultado-badges">${tudo}</div>` : '';
}

function renderJogos(games) {
  jogosCache = games;
  const container = document.getElementById('games-list');
  const editavel = podeEditar();

  if (games.length === 0) {
    container.innerHTML = emptyState('Nenhum jogo vinculado a este event ainda — use a busca acima');
    return;
  }

  const ordenados = [...games].sort((a, b) => a.ordem - b.ordem);
  container.innerHTML = ordenados.map((j, i) => `
    <div class="game-card ${j.ativo ? '' : 'inativo'}" data-id="${j.id}">
      <div>
        <div class="game-nome">
          ${escapar(j.nome)}
          ${j.pendente_aprovacao ? '<span class="badge-pendente-game">Aguardando aprovação</span>' : ''}
          ${j.jogo_ativo_global === false ? '<span class="badge-pendente-game" title="Desativado no catálogo global por super">Oculto globalmente</span>' : ''}
        </div>
        <div class="game-meta">
          slug: ${j.slug}
          ${j.score_max ? ` · máx: ${j.score_max.toLocaleString('pt-BR')}` : ' · sem limite de score'}
        </div>
        ${badgesMetadado(j)}
      </div>
      <div class="game-actions">
        ${editavel ? `
        <button class="btn-action btn-ocultar btn-reordenar" data-id="${j.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} title="Mover pra cima" style="padding:2px 8px">↑</button>
        <button class="btn-action btn-ocultar btn-reordenar" data-id="${j.id}" data-dir="1" ${i === ordenados.length - 1 ? 'disabled' : ''} title="Mover pra baixo" style="padding:2px 8px">↓</button>
        <div class="toggle-ativo ${j.ativo ? 'on' : ''}" data-id="${j.id}" data-ativo="${j.ativo}"
             title="${j.ativo ? 'Ativo neste event — clique para desativar' : 'Inativo neste event — clique para ativar'}"></div>
        ` : ''}
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.toggle-ativo').forEach(toggle => {
    toggle.addEventListener('click', async () => {
      const id = toggle.dataset.id, ativo = toggle.dataset.ativo === 'true';
      try {
        await apiFetch(`/api/admin/events/${eventoAtual}/games/${id}`, 'PATCH', { ativo: !ativo });
        showToast(!ativo ? 'Jogo ativado neste event' : 'Jogo desativado neste event', 'success');
        carregarJogos();
      } catch { showToast('Erro ao atualizar jogo', 'error'); }
    });
  });

  container.querySelectorAll('.btn-reordenar').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = ordenados.findIndex(j => j.id === btn.dataset.id);
      const alvoIdx = idx + parseInt(btn.dataset.dir);
      if (alvoIdx < 0 || alvoIdx >= ordenados.length) return;
      const nova = [...ordenados];
      [nova[idx], nova[alvoIdx]] = [nova[alvoIdx], nova[idx]];
      try {
        await Promise.all(nova.map((j, i) =>
          apiFetch(`/api/admin/events/${eventoAtual}/games/${j.id}`, 'PATCH', { ordem: i })
        ));
        carregarJogos();
      } catch { showToast('Erro ao reordenar', 'error'); }
    });
  });
}

// ── CATÁLOGO GLOBAL + FILTROS (docs/CATALOGO_JOGOS_SPEC.md Fase 7) ─────────
async function carregarCatalogo() {
  if (catalogoCache) return catalogoCache;
  try {
    const resp = await apiFetch('/api/admin/games-todos');
    catalogoCache = resp.ok ? await resp.json() : [];
  } catch { catalogoCache = []; }
  return catalogoCache;
}

function popularFiltros() {
  const generos = new Set(), geracoes = new Set();
  for (const g of catalogoCache) {
    (g.generos  || []).forEach(x => generos.add(x));
    (g.geracoes || []).forEach(x => geracoes.add(x));
  }
  const selGenero  = document.getElementById('filtro-genero');
  const selGeracao = document.getElementById('filtro-geracao');
  [...generos].sort().forEach(g =>
    selGenero.insertAdjacentHTML('beforeend', `<option value="${escapar(g)}">${escapar(g)}</option>`));
  [...geracoes].sort((a, b) => a - b).forEach(g =>
    selGeracao.insertAdjacentHTML('beforeend', `<option value="${g}">${g}ª geração</option>`));
}

function ligarBusca() {
  const input = document.getElementById('busca-input');
  input.addEventListener('input', () => {
    renderResultadosCatalogo();

    clearTimeout(igdbDebounceTimer);
    const termo = input.value.trim();
    const resultadosIgdb = document.getElementById('resultados-igdb');
    if (termo.length < 2) {
      resultadosIgdb.innerHTML = '';
      document.getElementById('credito-igdb').style.display = 'none';
      return;
    }
    igdbDebounceTimer = setTimeout(() => buscarIgdb(termo), DEBOUNCE_MS);
  });

  document.getElementById('filtro-genero').addEventListener('change', renderResultadosCatalogo);
  document.getElementById('filtro-geracao').addEventListener('change', renderResultadosCatalogo);

  document.getElementById('manual-toggle-btn').addEventListener('click', () => {
    const form = document.getElementById('manual-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('manual-criar-btn').addEventListener('click', criarJogoManual);
}

// Busca local no catálogo já carregado — instantânea, sem debounce.
// Funciona com só filtro (sem termo digitado) pra permitir "navegar por
// gênero/geração" sem precisar saber o nome do jogo — pedido do Bruno.
function renderResultadosCatalogo() {
  const container = document.getElementById('resultados-catalogo');
  const termo    = document.getElementById('busca-input').value.trim().toLowerCase();
  const genero   = document.getElementById('filtro-genero').value;
  const geracaoV = document.getElementById('filtro-geracao').value;
  const geracao  = geracaoV ? parseInt(geracaoV, 10) : null;

  if (!termo && !genero && !geracao) { container.innerHTML = ''; return; }

  const idsNoEvento = new Set((jogosCache || []).map(j => j.id));
  const achados = catalogoCache
    .filter(g => !g.pendente_aprovacao && !idsNoEvento.has(g.id))
    .filter(g => !termo    || g.nome.toLowerCase().includes(termo))
    .filter(g => !genero   || (g.generos  || []).includes(genero))
    .filter(g => !geracao  || (g.geracoes || []).includes(geracao))
    .slice(0, 12);

  if (achados.length === 0) {
    container.innerHTML = '<p class="resultados-grupo-titulo">Nada no catálogo bate com isso</p>';
    return;
  }

  container.innerHTML = '<p class="resultados-grupo-titulo">Já no catálogo</p>' + achados.map(g => `
    <div class="resultado-card">
      ${g.capa_url ? `<img src="${escapar(g.capa_url)}" alt="" style="width:36px;height:48px;object-fit:cover;border-radius:4px">` : ''}
      <div style="flex:1;min-width:0">
        <div class="game-nome" style="font-size:var(--text-sm)">${escapar(g.nome)}</div>
        ${badgesMetadado(g)}
      </div>
      ${eventoAtual
        ? `<button class="btn-action btn-reativar btn-vincular-catalogo" data-id="${g.id}">+ Vincular</button>`
        : ''}
    </div>
  `).join('');

  container.querySelectorAll('.btn-vincular-catalogo').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        const ordem = (jogosCache || []).length;
        const resp = await apiFetch(`/api/admin/events/${eventoAtual}/games/${btn.dataset.id}?ordem=${ordem}`, 'POST');
        if (!resp.ok) {
          const err = await resp.json();
          showToast(err.detail || 'Erro ao vincular jogo', 'error');
          return;
        }
        showToast('Jogo vinculado ao event', 'success');
        limparBusca();
        await carregarJogos();
      } catch { showToast('Erro ao vincular jogo', 'error'); }
    });
  });
}

function limparBusca() {
  document.getElementById('busca-input').value = '';
  document.getElementById('resultados-catalogo').innerHTML = '';
  document.getElementById('resultados-igdb').innerHTML = '';
  document.getElementById('credito-igdb').style.display = 'none';
}

// ── BUSCA IGDB — docs/CATALOGO_JOGOS_SPEC.md Fase 5/7 ───────────────────────
async function buscarIgdb(termo) {
  const container = document.getElementById('resultados-igdb');
  if (igdbIndisponivel) return;

  try {
    const resp = await apiFetch(`/api/admin/games/buscar-igdb?q=${encodeURIComponent(termo)}`);
    if (resp.status === 503) {
      igdbIndisponivel = true;
      container.innerHTML = '';
      showToast('Busca por jogo indisponível — use o cadastro manual', 'info');
      return;
    }
    if (!resp.ok) { container.innerHTML = ''; return; }

    const todosResultados = await resp.json();
    // Não reoferece jogo que já está no catálogo (achável pela busca
    // local acima) — evita duplicar a mesma sugestão nas duas listas.
    const idsIgdbNoCatalogo = new Set(
      catalogoCache.filter(g => g.igdb_id).map(g => g.igdb_id)
    );
    const resultados = todosResultados.filter(r => !idsIgdbNoCatalogo.has(r.igdb_id));

    if (resultados.length === 0) {
      container.innerHTML = '';
      document.getElementById('credito-igdb').style.display = 'none';
      return;
    }
    document.getElementById('credito-igdb').style.display = 'block';

    container.innerHTML = '<p class="resultados-grupo-titulo">Encontrado na IGDB</p>' + resultados.map((r, i) => `
      <div class="resultado-card">
        ${r.capa_url ? `<img src="${escapar(r.capa_url)}" alt="" style="width:36px;height:48px;object-fit:cover;border-radius:4px">` : ''}
        <div style="flex:1;min-width:0">
          <div class="game-nome" style="font-size:var(--text-sm)">${escapar(r.nome)}</div>
          <div class="game-meta">${escapar(r.plataforma || '')} ${r.ano_lancamento || ''}</div>
          ${badgesMetadado(r)}
        </div>
        <button class="btn-action btn-reativar btn-cadastrar-igdb" data-idx="${i}">
          ${eventoAtual ? '+ Cadastrar e vincular' : '+ Cadastrar'}
        </button>
      </div>
    `).join('');

    container.querySelectorAll('.btn-cadastrar-igdb').forEach(btn => {
      btn.addEventListener('click', () => selecionarJogoIgdb(resultados[parseInt(btn.dataset.idx, 10)]));
    });
  } catch { container.innerHTML = ''; }
}

async function selecionarJogoIgdb(resultado) {
  const slug = resultado.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const body = {
    nome: resultado.nome, slug,
    plataforma: resultado.plataforma, ano_lancamento: resultado.ano_lancamento,
    capa_url: resultado.capa_url, igdb_id: resultado.igdb_id,
    generos: resultado.generos, geracoes: resultado.geracoes,
  };
  // event_id só vai se já houver event selecionado — sem isso, o jogo
  // nasce no catálogo sem vínculo nenhum (comportamento já suportado
  // pelo backend desde o achado 5.9), e o admin vincula depois pela
  // busca "Já no catálogo".
  if (eventoAtual) body.event_id = eventoAtual;

  const resp = await apiFetch('/api/admin/games', 'POST', body);

  if (resp.ok) {
    showToast(`"${resultado.nome}" cadastrado${eventoAtual ? ' e vinculado' : ' — vincule a um event quando quiser'}!`, 'success');
    limparBusca();
    catalogoCache = null;
    await carregarCatalogo();
    if (eventoAtual) await carregarJogos();
  } else {
    const d = await resp.json();
    showToast(d.detail || 'Erro ao cadastrar jogo', 'error');
  }
}

async function criarJogoManual() {
  const nome        = document.getElementById('manual-nome').value.trim();
  const slugInput   = document.getElementById('manual-slug').value.trim();
  const plataforma  = document.getElementById('manual-plataforma').value.trim() || null;
  const scoreMaxRaw = document.getElementById('manual-score-max').value.trim();
  const scoreMax    = scoreMaxRaw ? parseInt(scoreMaxRaw, 10) : null;

  if (!nome) { showToast('Nome é obrigatório', 'error'); return; }
  const slug = slugInput || nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const body = { nome, slug, plataforma, score_max: scoreMax };
  if (eventoAtual) body.event_id = eventoAtual;

  const resp = await apiFetch('/api/admin/games', 'POST', body);

  if (resp.ok) {
    showToast(`"${nome}" cadastrado${eventoAtual ? ' e vinculado' : ''}!`, 'success');
    document.getElementById('manual-nome').value = '';
    document.getElementById('manual-slug').value = '';
    document.getElementById('manual-plataforma').value = '';
    document.getElementById('manual-score-max').value = '';
    catalogoCache = null;
    await carregarCatalogo();
    if (eventoAtual) await carregarJogos();
  } else {
    const d = await resp.json();
    showToast(d.detail || 'Erro ao cadastrar jogo', 'error');
  }
}
</script>
