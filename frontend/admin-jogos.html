<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Jogos — Retro Score Ranking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin-common.css">
  <style>
    /* docs/PAINEIS_ADMIN_SPEC.md §9/§10/§11, docs/CATALOGO_JOGOS_SPEC.md
       Fase 7 — canto "Jogos": duas seções distintas, não uma. "Catálogo da
       plataforma" é sempre uma listagem completa (filtrável/buscável) de
       todo jogo que existe, vinculado a este evento ou não — resolve
       "quais jogos existem na plataforma", que a busca-só-com-termo não
       resolvia. "Vinculados a este evento" é o vínculo (ativo/ordem) do
       evento em contexto, escopo mais estreito. Vínculo a Arena/evento
       exige evento selecionado; catálogo funciona sem isso. Reordenado a
       partir de feedback de uso real do Bruno — antes exigia escolher
       evento primeiro pra poder buscar qualquer coisa. */
    .admin-page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .admin-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      padding-right: calc(var(--space-lg) + 44px + var(--space-md));
      background: var(--color-bg-surface);
      border-bottom: var(--border-width) solid var(--color-border);
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .topbar-brand { display: flex; align-items: center; gap: var(--space-sm); }
    .topbar-logo { height: 28px; width: auto; object-fit: contain; }
    .topbar-title { font-family: var(--font-display); font-size: var(--text-xs); color: var(--color-primary); letter-spacing: 0.08em; }
    .topbar-right { display: flex; align-items: center; gap: var(--space-md); }

    .conteudo { padding: var(--space-lg); max-width: 900px; margin: 0 auto; width: 100%; }

    .game-nome { font-size: var(--text-md); font-weight: var(--weight-bold); }
    .badge-pendente-game {
      display: inline-block;
      font-size: 10px;
      font-weight: var(--weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--color-warning, #e6a23c);
      color: #1a1a1a;
      padding: 2px 8px;
      border-radius: var(--radius-full, 999px);
      margin-left: 8px;
      vertical-align: middle;
    }
    .game-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }

    .toggle-ativo {
      width: 44px; height: 24px;
      border-radius: var(--radius-full);
      background: var(--color-bg-surface2);
      border: var(--border-width) solid var(--color-border);
      cursor: pointer;
      position: relative;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .toggle-ativo.on { background: var(--color-secondary); border-color: var(--color-secondary); }
    .toggle-ativo::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform var(--transition);
    }
    .toggle-ativo.on::after { transform: translateX(20px); }

    .btn-action {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all var(--transition);
      border: var(--border-width) solid transparent;
      white-space: nowrap;
    }
    .btn-ocultar  { background: rgba(240,64,96,0.12); color: var(--color-error); border-color: rgba(240,64,96,0.3); }
    .btn-ocultar:hover  { background: rgba(240,64,96,0.25); }
    .btn-reativar { background: rgba(95,187,80,0.12); color: var(--color-success); border-color: rgba(95,187,80,0.3); }
    .btn-reativar:hover { background: rgba(95,187,80,0.25); }

    .caixa-form {
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .form-title { font-size: var(--text-md); font-weight: var(--weight-bold); margin-bottom: var(--space-md); color: var(--color-secondary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    .busca-filtros { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin: var(--space-sm) 0; }
    .busca-filtros select {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      background: var(--color-bg);
      color: var(--color-text);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
    }
    .resultados-grupo-titulo {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: var(--space-md) 0 var(--space-xs);
    }
    /* Grid, não flex — pra plataforma/ano/ação ficarem em colunas
       alinhadas entre um jogo e outro, em vez de deslizar conforme o
       tamanho do nome/badges de cada linha (pedido do Bruno). */
    .resultado-card, .resultado-header {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 110px 56px auto;
      gap: 10px;
      align-items: center;
    }
    .resultado-card {
      min-height: 48px;
      padding: 8px 0;
      border-bottom: var(--border-width) solid var(--color-border);
    }
    /* Reserva o espaço da capa mesmo quando o jogo não tem imagem
       (cadastro manual) — sem isso a linha desse jogo encolhia bem
       menos que a de um jogo com capa, quebrando o ritmo da tabela. */
    .resultado-card-capa {
      width: 36px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .resultado-header {
      padding: 0 0 4px;
      font-size: 10px;
      font-weight: var(--weight-bold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      border-bottom: var(--border-width) solid var(--color-border);
    }
    .resultado-card-plataforma, .resultado-card-ano {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .resultado-card-ano, .resultado-header .col-ano { text-align: right; }
    .resultado-card-acoes { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    @media (max-width: 640px) {
      .resultado-card, .resultado-header { grid-template-columns: 36px minmax(0, 1fr) auto; }
      .resultado-card-plataforma, .resultado-card-ano,
      .resultado-header .col-plataforma, .resultado-header .col-ano { display: none; }
    }
    /* Listas simples (candidatos de resync, resultado de busca IGDB) —
       não são o catálogo tabulado acima, ficam com o flex de sempre. */
    .card-simples {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: var(--border-width) solid var(--color-border);
    }
    .resultado-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .badge-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-full, 999px);
      background: var(--color-bg-surface2);
      color: var(--color-text-muted);
    }
    /* CATALOGO_JOGOS_SPEC.md 8.3 — detalhe rico só ao expandir, pra não
       pesar a listagem de até 60 cards com resumo/galeria/etc de cada. */
    .btn-detalhe {
      background: var(--color-bg-surface2);
      color: var(--color-text-muted);
      border-color: var(--color-border);
    }
    .btn-detalhe:hover { background: var(--color-bg-surface); }
    .resultado-detalhe {
      padding: var(--space-sm) 0 var(--space-md) 46px;
      border-bottom: var(--border-width) solid var(--color-border);
    }
    .resultado-detalhe .game-meta { margin-bottom: 4px; }
    .badge-rating-igdb {
      display: inline-block;
      font-size: 10px;
      font-weight: var(--weight-bold);
      background: var(--color-bg-surface2);
      color: var(--color-text-muted);
      padding: 2px 8px;
      border-radius: var(--radius-full, 999px);
    }

    .empty-admin { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--color-text-muted); }
    .empty-admin-icon { font-size: 48px; margin-bottom: var(--space-md); }
    .empty-admin-text { font-size: var(--text-md); font-weight: var(--weight-bold); color: var(--color-text-dim); }

    #jogos-loading { text-align: center; padding: var(--space-2xl); color: var(--color-text-muted); }

    /* Lightbox de imagem ampliada (8.3/candidatos de resync) */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      padding: var(--space-lg);
    }
    .lightbox-frame {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      padding: var(--space-lg);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-md);
      display: flex;
    }
    .lightbox-frame img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: block;
    }
    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .lightbox-close:hover { background: rgba(0,0,0,0.9); }
    .carregando-igdb { animation: pulse 1.2s ease-in-out infinite; }
    .aviso-nome-existente { color: var(--color-warning, #e6a23c); margin-top: 2px; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="jogos-loading">Carregando…</div>

<div class="admin-page" id="pagina" style="display:none">
  <div class="admin-topbar">
    <span class="topbar-brand">
      <img src="logo.png" alt="" class="topbar-logo">
      <span class="topbar-title">JOGOS</span>
    </span>
    <div class="topbar-right">
      <div id="arena-selector"></div>
      <div id="event-selector"></div>
    </div>
  </div>

  <div class="conteudo">
    <div id="jogos-sem-arena" style="display:none;color:var(--color-text-muted);font-size:var(--text-sm)">
      Você ainda não administra nenhuma Arena.
      <a href="admin.html" style="color:var(--color-primary)">Voltar ao painel</a>
    </div>

    <!-- Catálogo lidera a tela — funciona com ou sem evento escolhido, e
         lista todo jogo que existe na plataforma por padrão (não só
         resultado de busca). Vincular/ativar/desativar no evento também
         acontece aqui, direto no card (CATALOGO_JOGOS_SPEC.md Fase 9) —
         não existe mais uma segunda lista "Vinculados a este evento";
         ordenar por critério virou ação da config do evento em
         admin.html, não daqui. -->
    <div id="busca-secao" style="display:none">
      <div class="caixa-form">
        <p class="form-title">Catálogo da plataforma</p>
        <input class="field-input" type="search" id="busca-input" placeholder="Filtrar por nome (ex: Street Fighter)…">
        <div class="busca-filtros">
          <select id="filtro-genero"><option value="">Gênero: qualquer</option></select>
          <select id="filtro-geracao"><option value="">Geração: qualquer</option></select>
        </div>

        <p class="game-meta" id="sem-event-hint" style="display:none">
          Crie um evento nesta Arena pra poder vincular jogos a ele — o catálogo abaixo funciona sem isso, só o vínculo espera.
        </p>

        <div id="resultados-catalogo"></div>
        <div id="resultados-igdb"></div>
        <p class="game-meta" id="credito-igdb" style="display:none;font-size:var(--text-xs);opacity:0.7;margin-top:var(--space-sm)">
          Dados de jogos fornecidos por IGDB.com
        </p>

        <button class="btn-action btn-ocultar" id="manual-toggle-btn" style="margin-top:var(--space-md)">Não encontrei — cadastro manual</button>
        <div id="manual-form" style="display:none;margin-top:var(--space-md)">
          <div class="form-row">
            <div class="field">
              <label class="field-label" for="manual-nome">Nome</label>
              <input class="field-input" type="text" id="manual-nome" placeholder="Ex: Pac-Man">
            </div>
            <div class="field">
              <label class="field-label" for="manual-slug">Slug (URL)</label>
              <input class="field-input" type="text" id="manual-slug" placeholder="Ex: pac-man">
            </div>
          </div>
          <div class="field" style="margin-top:var(--space-sm)">
            <label class="field-label" for="manual-plataforma">Plataforma (opcional)</label>
            <input class="field-input" type="text" id="manual-plataforma" placeholder="Ex: Arcade">
          </div>
          <div class="field" style="margin-top:var(--space-sm)">
            <label class="field-label" for="manual-score-max">Score máximo (opcional)</label>
            <input class="field-input" type="number" id="manual-score-max" placeholder="Deixe vazio para sem limite">
          </div>
          <button class="btn-primary" id="manual-criar-btn" style="margin-top:var(--space-md)">CADASTRAR JOGO</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module">
import {
  exigirAdmin, apiFetch, escapar, showToast,
  inicializarArenaAtiva, getArenaAtual, onArenaChange, eventosDaArenaAtiva,
  nivelNaArena, getMeInfo, montarDropdownPill,
} from './admin-common.js';
import { inserirNav } from './nav.js';

inserirNav('jogos');

// docs/PAINEIS_ADMIN_SPEC.md §10 (Fase V) — 400ms original ficava curto
// pra digitação normal, aumentado pra dar mais tempo antes de disparar
// a busca de rede (a busca local no catálogo já é instantânea, não
// precisa de debounce — só a chamada IGDB é debounced).
const DEBOUNCE_MS = 600;

let eventoAtual          = null;
let jogosCache           = [];
let catalogoCache        = null;
// CATALOGO_JOGOS_SPEC.md 8.B1 — cooldown curto (timestamp), não mais um
// latch permanente pro resto da sessão: uma falha transitória não deve
// exigir reload de página pra buscar de novo.
let igdbIndisponivelAte  = 0;
let igdbDebounceTimer    = null;
// Detalhe rico (8.3) fica fechado por padrão — só um jogo expandido por
// vez, guardado pelo id local (não igdb_id).
let jogoDetalheAbertoId  = null;

(async () => {
  const meInfo = await exigirAdmin();
  if (!meInfo) return; // exigirAdmin já redirecionou pra admin.html

  document.getElementById('jogos-loading').style.display = 'none';
  document.getElementById('pagina').style.display = 'grid';

  // Catálogo é global (não depende de arena) — carrega em paralelo com a
  // inicialização da arena ativa, em vez de esperar uma terminar pra
  // começar a outra. Reduz a cadeia de round-trips sequenciais na
  // primeira carga, quando o cold start do backend já pesa sozinho.
  await Promise.all([
    inicializarArenaAtiva(document.getElementById('arena-selector')),
    carregarCatalogo(),
  ]);

  if (!getArenaAtual()) {
    document.getElementById('jogos-sem-arena').style.display = 'block';
    return;
  }

  popularFiltros();
  ligarBusca();
  atualizarVisibilidadeBusca();

  onArenaChange(() => { atualizarVisibilidadeBusca(); popularSeletorEvento(); });
  await popularSeletorEvento();
})();

// Moderador só lê — leitura de games do evento já é liberada pro
// moderador no backend (docs/PERMISSOES_SPEC.md §7 item 5). A seção de
// catálogo inteira (que só serve pra criar/vincular) fica escondida pra
// quem não edita, mesmo padrão de antes.
function podeEditar() {
  const meInfo = getMeInfo();
  if (!meInfo) return false;
  return meInfo.super || nivelNaArena(getArenaAtual()) === 'admin';
}

// Resync (8.5) usa o mesmo gate de edição do catálogo global da Fase 6
// (_exigir_super_editar_game no backend) — mais estreito que podeEditar,
// que também libera admin de arena (esses só controlam o vínculo).
function souSuper() {
  const meInfo = getMeInfo();
  return !!(meInfo && meInfo.super);
}

function atualizarVisibilidadeBusca() {
  document.getElementById('busca-secao').style.display = podeEditar() ? 'block' : 'none';
}

async function popularSeletorEvento() {
  const container = document.getElementById('event-selector');
  const meInfo = getMeInfo();
  let eventos;

  if (meInfo.super) {
    try {
      const resp = await apiFetch('/api/admin/events');
      eventos = resp.ok ? (await resp.json()).filter(e => e.arena_id === getArenaAtual()) : [];
    } catch { eventos = []; }
  } else {
    eventos = eventosDaArenaAtiva() || [];
  }

  if (eventos.length === 0) {
    container.innerHTML = '';
    document.getElementById('sem-event-hint').style.display = 'block';
    eventoAtual = null;
    jogosCache  = []; // sem evento, nada está "já vinculado" pra filtrar
    renderResultadosCatalogo(); // reflete a falta de evento nos botões
    return;
  }

  document.getElementById('sem-event-hint').style.display = 'none';

  if (!eventoAtual || !eventos.some(e => e.id === eventoAtual)) eventoAtual = eventos[0].id;

  montarDropdownPill(container, {
    itens: eventos,
    valorAtual: eventoAtual,
    onChange: (id) => { eventoAtual = id; carregarJogos(); renderResultadosCatalogo(); },
    renderPill: pillEvento,
    renderItem: pillEvento,
  });

  await carregarJogos();
  renderResultadosCatalogo(); // catálogo reflete o vínculo do evento agora carregado
}

function pillEvento(e) {
  return `<span>${escapar(e.nome)}${e.ativo === false ? ' (arquivado)' : ''}</span>`;
}

// ── LISTA DE JOGOS DO EVENT (mesma fonte de admin.html, Fase I) ────────────
// Só popula jogosCache (vínculo + ativo/ordem de cada jogo no evento) —
// não tem mais lista própria pra renderizar (CATALOGO_JOGOS_SPEC.md
// Fase 9): o card do catálogo (renderResultadosCatalogo) já mostra e
// edita o vínculo de cada jogo diretamente.
async function carregarJogos() {
  if (!eventoAtual) { jogosCache = []; return; }
  try {
    const resp = await apiFetch(`/api/admin/events/${eventoAtual}/games`);
    jogosCache = resp.ok ? await resp.json() : [];
  } catch { jogosCache = []; }
}

// Lightbox de imagem — pedido do Bruno pra conseguir ver a capa ampliada
// antes de confirmar qual jogo da IGDB é o certo (candidatos do resync,
// 8.5.3). Clique em qualquer capa/screenshot abre em tamanho grande, na
// maior resolução que a IGDB serve (t_original), não só esticado por
// CSS — a miniatura da listagem usa t_cover_big/t_screenshot_big.
function imgAmpliavel(url, style) {
  if (!url) return '';
  return `<img src="${escapar(url)}" alt="" class="img-ampliavel" data-full="${escapar(url)}" style="${style};cursor:zoom-in">`;
}

// Pedido do Bruno — resultado da IGDB (busca e candidatos de resync)
// ordenado do mais antigo pro mais novo: pra catálogo retrô, o jogo
// original tende a ser o candidato certo, não o remaster/relançamento;
// sem ano (raro) fica por último, não misturado no meio.
// Achado 2026-09-05 (River Raid) — nome igual, sem igdb_id em comum,
// não era pego pelo dedup existente (por igdb_id). Comparação simples
// (case/trim-insensitive) é suficiente pro caso real que aconteceu;
// não tenta ser tão abrangente quanto a colisão por substring do
// cadastro manual (game_admissao.avaliar_colisao) de propósito — aqui é
// só aviso, não bloqueio, então prefere menos falso-positivo.
function acharNoCatalogoPorNome(nome) {
  const alvo = nome.trim().toLowerCase();
  return (catalogoCache || []).find(g => g.nome.trim().toLowerCase() === alvo) || null;
}

function ordenarPorAnoAntigo(lista) {
  return [...lista].sort((a, b) => {
    if (a.ano_lancamento == null) return 1;
    if (b.ano_lancamento == null) return -1;
    return a.ano_lancamento - b.ano_lancamento;
  });
}

function urlImagemOriginal(url) {
  return url.replace(/\/t_[a-z0-9_]+\//, '/t_original/');
}

function abrirLightbox(url) {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `
    <div class="lightbox-frame">
      <img src="${escapar(urlImagemOriginal(url))}" alt="">
      <button type="button" class="lightbox-close" aria-label="Fechar" title="Fechar">✕</button>
    </div>
  `;

  const fechar = () => {
    overlay.remove();
    document.removeEventListener('keydown', aoTeclar);
  };
  function aoTeclar(e) { if (e.key === 'Escape') fechar(); }

  overlay.addEventListener('click', fechar);
  document.addEventListener('keydown', aoTeclar);
  document.body.appendChild(overlay);
}

// Delegação num único listener — sobrevive a todo re-render de
// innerHTML das listas (catálogo, busca IGDB, candidatos de resync).
document.addEventListener('click', (e) => {
  const img = e.target.closest('.img-ampliavel');
  if (img) abrirLightbox(img.dataset.full);
});

function badgesMetadado(g) {
  const generos  = (g.generos  || []).map(x => `<span class="badge-tag">${escapar(x)}</span>`);
  const geracoes = (g.geracoes || []).map(x => `<span class="badge-tag">${x}ª ger.</span>`);
  const tudo = [...generos, ...geracoes].join('');
  return tudo ? `<div class="resultado-badges">${tudo}</div>` : '';
}

// ── CATÁLOGO GLOBAL + FILTROS (docs/CATALOGO_JOGOS_SPEC.md Fase 7) ─────────
async function carregarCatalogo() {
  if (catalogoCache) return catalogoCache;
  try {
    const resp = await apiFetch('/api/admin/games-todos');
    catalogoCache = resp.ok ? await resp.json() : [];
  } catch { catalogoCache = []; }
  return catalogoCache;
}

function popularFiltros() {
  const generos = new Set(), geracoes = new Set();
  for (const g of catalogoCache) {
    (g.generos  || []).forEach(x => generos.add(x));
    (g.geracoes || []).forEach(x => geracoes.add(x));
  }
  const selGenero  = document.getElementById('filtro-genero');
  const selGeracao = document.getElementById('filtro-geracao');
  [...generos].sort().forEach(g =>
    selGenero.insertAdjacentHTML('beforeend', `<option value="${escapar(g)}">${escapar(g)}</option>`));
  [...geracoes].sort((a, b) => a - b).forEach(g =>
    selGeracao.insertAdjacentHTML('beforeend', `<option value="${g}">${g}ª geração</option>`));
}

function ligarBusca() {
  const input = document.getElementById('busca-input');
  input.addEventListener('input', () => {
    renderResultadosCatalogo();

    clearTimeout(igdbDebounceTimer);
    const termo = input.value.trim();
    const resultadosIgdb = document.getElementById('resultados-igdb');
    if (termo.length < 2) {
      resultadosIgdb.innerHTML = '';
      document.getElementById('credito-igdb').style.display = 'none';
      return;
    }
    igdbDebounceTimer = setTimeout(() => buscarIgdb(termo), DEBOUNCE_MS);
  });

  document.getElementById('filtro-genero').addEventListener('change', renderResultadosCatalogo);
  document.getElementById('filtro-geracao').addEventListener('change', renderResultadosCatalogo);

  document.getElementById('manual-toggle-btn').addEventListener('click', () => {
    const form = document.getElementById('manual-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('manual-criar-btn').addEventListener('click', criarJogoManual);
}

// Listagem do catálogo completo da plataforma — sempre populada, com ou
// sem termo/filtro (docs/PAINEIS_ADMIN_SPEC.md §11: resolve "quais jogos
// existem na plataforma", que antes só aparecia como resultado de busca
// e ficava em branco sem termo digitado). Busca local, instantânea, sem
// debounce — só a chamada IGDB (função seguinte) é debounced. Jogo já
// vinculado ao evento atual continua na lista (não desaparece), só troca
// o botão "+Vincular" por um selo — omitir esconderia justamente o que a
// tela existe pra mostrar.
function renderResultadosCatalogo() {
  const container = document.getElementById('resultados-catalogo');
  const termo    = document.getElementById('busca-input').value.trim().toLowerCase();
  const genero   = document.getElementById('filtro-genero').value;
  const geracaoV = document.getElementById('filtro-geracao').value;
  const geracao  = geracaoV ? parseInt(geracaoV, 10) : null;
  const filtrando = !!(termo || genero || geracao);

  // CATALOGO_JOGOS_SPEC.md 8.3 — termo também bate contra nome
  // alternativo/palavra-chave da IGDB (não exibidos, só ampliam o
  // achar), ex.: buscar "Rockman" acha um jogo cadastrado como "Mega Man".
  const bateTermo = g => !termo
    || g.nome.toLowerCase().includes(termo)
    || (g.nomes_alternativos || []).some(n => n.toLowerCase().includes(termo))
    || (g.palavras_chave      || []).some(k => k.toLowerCase().includes(termo));

  const vinculoPorId = new Map((jogosCache || []).map(j => [j.id, j]));
  const achados = catalogoCache
    .filter(g => !g.pendente_aprovacao) // fila de aprovação vive no console, não aqui
    .filter(bateTermo)
    .filter(g => !genero   || (g.generos  || []).includes(genero))
    .filter(g => !geracao  || (g.geracoes || []).includes(geracao))
    .slice(0, 60); // dataset pequeno hoje (dezenas) — reavaliar se crescer (CATALOGO_JOGOS_SPEC.md 7.5)

  if (achados.length === 0) {
    container.innerHTML = filtrando
      ? '<p class="resultados-grupo-titulo">Nada no catálogo bate com isso</p>'
      : '<p class="resultados-grupo-titulo">Catálogo da plataforma vazio</p>';
    return;
  }

  const titulo = filtrando
    ? `${achados.length} jogo${achados.length === 1 ? '' : 's'} encontrado${achados.length === 1 ? '' : 's'}`
    : `Catálogo da plataforma — ${achados.length} jogo${achados.length === 1 ? '' : 's'}`;

  const cabecalho = `
    <div class="resultado-header">
      <span></span>
      <span>Jogo</span>
      <span class="col-plataforma">Plataforma</span>
      <span class="col-ano">Ano</span>
      <span></span>
    </div>`;

  container.innerHTML = `<p class="resultados-grupo-titulo">${titulo}</p>${cabecalho}` + achados.map(g => {
    const vinculo = vinculoPorId.get(g.id);
    // Card do catálogo concentra vincular + ativar/desativar no evento
    // (CATALOGO_JOGOS_SPEC.md Fase 9) — não existe mais lista separada
    // "Vinculados a este evento" só pra isso. Ordenar virou ação por
    // critério na config do evento, em admin.html.
    const acao = !eventoAtual
      ? ''
      : vinculo
        ? `<div class="toggle-ativo ${vinculo.ativo ? 'on' : ''}" data-id="${g.id}" data-ativo="${vinculo.ativo}"
             title="${vinculo.ativo ? 'Vinculado e ativo neste evento — clique para desativar' : 'Vinculado, mas inativo neste evento — clique para ativar'}"></div>`
        : `<button class="btn-action btn-reativar btn-vincular-catalogo" data-id="${g.id}">+ Vincular</button>`;
    const aberto = jogoDetalheAbertoId === g.id;
    return `
    <div class="resultado-card">
      <div class="resultado-card-capa">${imgAmpliavel(g.capa_url, 'width:36px;height:48px;object-fit:cover;border-radius:4px')}</div>
      <div style="min-width:0">
        <div class="game-nome" style="font-size:var(--text-sm)">
          ${escapar(g.nome)}
          ${g.ativo === false ? '<span class="badge-pendente-game" title="Desativado no catálogo global por super">Oculto globalmente</span>' : ''}
        </div>
        ${badgesMetadado(g)}
      </div>
      <div class="resultado-card-plataforma" title="${escapar(g.plataforma || '')}">${escapar(g.plataforma || '—')}</div>
      <div class="resultado-card-ano">${g.ano_lancamento || '—'}</div>
      <div class="resultado-card-acoes">
        <button class="btn-action btn-detalhe" data-id="${g.id}" title="Ver detalhe do jogo">${aberto ? '▴ Detalhes' : '▾ Detalhes'}</button>
        ${acao}
      </div>
    </div>
    ${aberto ? renderDetalheJogo(g) : ''}`;
  }).join('');

  container.querySelectorAll('.btn-vincular-catalogo').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        const ordem = (jogosCache || []).length;
        const resp = await apiFetch(`/api/admin/events/${eventoAtual}/games/${btn.dataset.id}?ordem=${ordem}`, 'POST');
        if (!resp.ok) {
          const err = await resp.json();
          showToast(err.detail || 'Erro ao vincular jogo', 'error');
          return;
        }
        showToast('Jogo vinculado ao evento', 'success');
        // Sem limparBusca() aqui de propósito — preserva o termo/filtro
        // atual, pra permitir vincular vários jogos do mesmo filtro em
        // sequência (ex.: todos os "de luta") sem redigitar cada vez.
        await carregarJogos();
        renderResultadosCatalogo();
      } catch { showToast('Erro ao vincular jogo', 'error'); }
    });
  });

  container.querySelectorAll('.btn-detalhe').forEach(btn => {
    btn.addEventListener('click', () => {
      jogoDetalheAbertoId = (jogoDetalheAbertoId === btn.dataset.id) ? null : btn.dataset.id;
      renderResultadosCatalogo();
    });
  });

  container.querySelectorAll('.toggle-ativo').forEach(toggle => {
    toggle.addEventListener('click', async () => {
      const id = toggle.dataset.id, ativo = toggle.dataset.ativo === 'true';
      try {
        await apiFetch(`/api/admin/events/${eventoAtual}/games/${id}`, 'PATCH', { ativo: !ativo });
        showToast(!ativo ? 'Jogo ativado neste evento' : 'Jogo desativado neste evento', 'success');
        await carregarJogos();
        renderResultadosCatalogo();
      } catch { showToast('Erro ao atualizar jogo', 'error'); }
    });
  });

  container.querySelectorAll('.btn-resync-igdb').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Atualizando…';
      await resincronizarIgdb(btn.dataset.id);
    });
  });

  container.querySelectorAll('.btn-escolher-candidato').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Ancorando…';
      await resincronizarIgdb(btn.dataset.id, parseInt(btn.dataset.igdbId, 10));
    });
  });
}

// docs/CATALOGO_JOGOS_SPEC.md 8.3/8.5 — detalhe rico só ao expandir
// (decisão do Bruno: card da listagem continua enxuto). Dois estados:
// candidatos pendentes de confirmação (jogo manual, resync clicado sem
// igdb_id ainda) ou o detalhe normal com o botão de resync.
let candidatosPorJogo = {};

function renderDetalheJogo(g) {
  const candidatos = candidatosPorJogo[g.id];

  if (candidatos) {
    if (candidatos.length === 0) {
      return `<div class="resultado-detalhe">
        <p class="game-meta">Nada encontrado na IGDB pra "${escapar(g.nome)}" — corrija o nome do jogo ou deixe como cadastro manual.</p>
      </div>`;
    }
    return `<div class="resultado-detalhe">
      <p class="resultados-grupo-titulo">Qual desses é "${escapar(g.nome)}"?</p>
      ${candidatos.map(c => `
        <div class="card-simples">
          ${imgAmpliavel(c.capa_url, 'width:32px;height:44px;object-fit:cover;border-radius:4px')}
          <div style="flex:1;min-width:0">
            <div class="game-nome" style="font-size:var(--text-sm)">${escapar(c.nome)}</div>
            <div class="game-meta">${escapar(c.plataforma || '')} ${c.ano_lancamento || ''}</div>
          </div>
          <button class="btn-action btn-reativar btn-escolher-candidato" data-id="${g.id}" data-igdb-id="${c.igdb_id}">Ancorar este</button>
        </div>
      `).join('')}
    </div>`;
  }

  const linhas = [];
  if (g.resumo) linhas.push(`<p class="game-meta">${escapar(g.resumo)}</p>`);
  if (g.desenvolvedora || g.publicadora) {
    linhas.push(`<p class="game-meta"><strong>Desenvolvedora:</strong> ${escapar(g.desenvolvedora || '—')} &nbsp;·&nbsp; <strong>Publicadora:</strong> ${escapar(g.publicadora || '—')}</p>`);
  }
  if ((g.modos_jogo || []).length) linhas.push(`<p class="game-meta"><strong>Modos:</strong> ${g.modos_jogo.map(escapar).join(', ')}</p>`);
  if ((g.modos_multiplayer || []).length) linhas.push(`<p class="game-meta"><strong>Multiplayer:</strong> ${g.modos_multiplayer.map(escapar).join(', ')}</p>`);
  if ((g.franquias || []).length) linhas.push(`<p class="game-meta"><strong>Franquia:</strong> ${g.franquias.map(escapar).join(', ')}</p>`);
  // 8.4 — rótulo sempre "Nota IGDB", nunca ao lado do ranking real da plataforma.
  if (g.rating_igdb != null) linhas.push(`<p class="game-meta"><span class="badge-rating-igdb">Nota IGDB: ${g.rating_igdb}/100</span></p>`);
  if ((g.classificacoes_etarias || []).length) linhas.push(`<p class="game-meta"><strong>Classificação etária:</strong> ${g.classificacoes_etarias.map(escapar).join(', ')}</p>`);

  const semNadaAinda = linhas.length === 0 && !g.screenshot_url;

  return `<div class="resultado-detalhe">
    ${imgAmpliavel(g.screenshot_url, 'width:100%;max-width:320px;border-radius:6px;margin-bottom:8px;object-fit:cover')}
    ${linhas.join('')}
    ${semNadaAinda ? '<p class="game-meta">Sem detalhe da IGDB ainda.</p>' : ''}
    ${souSuper() ? `<button class="btn-action btn-reativar btn-resync-igdb" data-id="${g.id}">↻ Atualizar da IGDB</button>` : ''}
  </div>`;
}

async function resincronizarIgdb(gameId, igdbIdEscolhido) {
  try {
    const resp = await apiFetch(
      `/api/admin/games/${gameId}/resync-igdb`, 'POST',
      igdbIdEscolhido ? { igdb_id: igdbIdEscolhido } : {},
    );
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      showToast(err.detail || 'Erro ao atualizar da IGDB', 'error');
      return;
    }
    const dados = await resp.json();
    if (dados.candidatos) {
      // 8.5.3 — nunca decide sozinho qual jogo da IGDB é o certo pra um
      // game manual, mesmo com 1 candidato só; sempre pede confirmação.
      candidatosPorJogo[gameId] = ordenarPorAnoAntigo(dados.candidatos);
    } else {
      delete candidatosPorJogo[gameId];
      const idx = catalogoCache.findIndex(x => x.id === dados.id);
      if (idx !== -1) catalogoCache[idx] = { ...catalogoCache[idx], ...dados };
      showToast('Jogo atualizado a partir da IGDB', 'success');
    }
    renderResultadosCatalogo();
  } catch {
    showToast('Erro ao atualizar da IGDB', 'error');
  }
}

function limparBusca() {
  document.getElementById('busca-input').value = '';
  document.getElementById('resultados-catalogo').innerHTML = '';
  document.getElementById('resultados-igdb').innerHTML = '';
  document.getElementById('credito-igdb').style.display = 'none';
}

// ── BUSCA IGDB — docs/CATALOGO_JOGOS_SPEC.md Fase 5/7/8 ─────────────────────
// 8.2/8.B1-8.B3 — achado investigando a queixa "nenhuma busca encontra
// nada": uma falha transitória (rede/rate-limit) travava
// `igdbIndisponivel` pro RESTO da sessão, e só a primeira falha mostrava
// toast — todo keystroke seguinte saía calado, indistinguível de "sem
// resultado". Cooldown curto (30s) + toast em toda falha corrige isso.
const IGDB_COOLDOWN_MS = 30_000;

function marcarIgdbIndisponivel(mensagem) {
  igdbIndisponivelAte = Date.now() + IGDB_COOLDOWN_MS;
  showToast(mensagem, 'error');
}

// Pedido do Bruno — a chamada de rede pra IGDB não é instantânea (viu
// ~2s num caso real em produção), sem indicador a tela ficava parada
// depois do debounce, parecendo travada.
function marcarCarregandoIgdb(container) {
  container.innerHTML = '<p class="resultados-grupo-titulo carregando-igdb">Buscando na IGDB…</p>';
}

async function buscarIgdb(termo) {
  const container = document.getElementById('resultados-igdb');
  if (Date.now() < igdbIndisponivelAte) return;

  marcarCarregandoIgdb(container);
  try {
    const resp = await apiFetch(`/api/admin/games/buscar-igdb?q=${encodeURIComponent(termo)}`);
    if (resp.status === 503) {
      container.innerHTML = '';
      marcarIgdbIndisponivel('Busca por jogo indisponível — tente de novo em instantes ou use o cadastro manual');
      return;
    }
    if (!resp.ok) {
      container.innerHTML = '';
      marcarIgdbIndisponivel('Erro ao buscar jogo na IGDB — tente de novo');
      return;
    }

    const todosResultados = await resp.json();
    // Não reoferece jogo que já está no catálogo (achável pela busca
    // local acima) — evita duplicar a mesma sugestão nas duas listas.
    const idsIgdbNoCatalogo = new Set(
      catalogoCache.filter(g => g.igdb_id).map(g => g.igdb_id)
    );
    const resultados = ordenarPorAnoAntigo(
      todosResultados.filter(r => !idsIgdbNoCatalogo.has(r.igdb_id))
    );

    if (resultados.length === 0) {
      container.innerHTML = '';
      document.getElementById('credito-igdb').style.display = 'none';
      return;
    }
    document.getElementById('credito-igdb').style.display = 'block';

    container.innerHTML = '<p class="resultados-grupo-titulo">Encontrado na IGDB</p>' + resultados.map((r, i) => {
      // Achado 2026-09-05 (River Raid) — dedup por igdb_id (acima) não
      // pega jogo manual com o mesmo nome; "+Cadastrar" criava um
      // registro novo e separado do que já tinha recorde/vínculo real.
      // Aviso + botão de override consciente, em vez de bloquear
      // (pode legitimamente ser um jogo diferente com nome igual).
      const existente = acharNoCatalogoPorNome(r.nome);
      const aviso = existente
        ? `<p class="game-meta aviso-nome-existente">⚠ Já existe "${escapar(existente.nome)}" no catálogo — considere "Atualizar da IGDB" nele em vez de cadastrar outro</p>`
        : '';
      const botao = existente
        ? `<button class="btn-action btn-detalhe btn-cadastrar-igdb" data-idx="${i}" title="Cria um registro novo e separado, mesmo já existindo um com esse nome">Cadastrar mesmo assim</button>`
        : `<button class="btn-action btn-reativar btn-cadastrar-igdb" data-idx="${i}">${eventoAtual ? '+ Cadastrar e vincular' : '+ Cadastrar'}</button>`;
      return `
      <div class="card-simples">
        ${imgAmpliavel(r.capa_url, 'width:36px;height:48px;object-fit:cover;border-radius:4px')}
        <div style="flex:1;min-width:0">
          <div class="game-nome" style="font-size:var(--text-sm)">${escapar(r.nome)}</div>
          <div class="game-meta">${escapar(r.plataforma || '')} ${r.ano_lancamento || ''}</div>
          ${badgesMetadado(r)}
          ${aviso}
        </div>
        ${botao}
      </div>
    `;
    }).join('');

    container.querySelectorAll('.btn-cadastrar-igdb').forEach(btn => {
      btn.addEventListener('click', () => selecionarJogoIgdb(resultados[parseInt(btn.dataset.idx, 10)]));
    });
  } catch {
    container.innerHTML = '';
    marcarIgdbIndisponivel('Erro ao buscar jogo na IGDB — tente de novo');
  }
}

async function selecionarJogoIgdb(resultado) {
  let slug = resultado.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  // Nomes repetidos entre jogos diferentes são comuns na IGDB (ex.:
  // "Donkey Kong" existe como registro separado pro arcade original e
  // pra versão de Game Boy) — sem desambiguar, o segundo cadastro
  // sempre colidia no slug (UNIQUE) e o POST inteiro falhava, incluindo
  // o vínculo ao evento (achado do Bruno, 2026-09-05). Ano de
  // lançamento resolve a esmagadora maioria dos casos; igdb_id como
  // último recurso se nem isso existir.
  if ((catalogoCache || []).some(g => g.slug === slug)) {
    slug += '-' + (resultado.ano_lancamento || resultado.igdb_id);
  }

  const body = {
    nome: resultado.nome, slug,
    plataforma: resultado.plataforma, ano_lancamento: resultado.ano_lancamento,
    capa_url: resultado.capa_url, igdb_id: resultado.igdb_id,
    generos: resultado.generos, geracoes: resultado.geracoes,
  };
  // event_id só vai se já houver event selecionado — sem isso, o jogo
  // nasce no catálogo sem vínculo nenhum (comportamento já suportado
  // pelo backend desde o achado 5.9), e o admin vincula depois pela
  // busca "Já no catálogo".
  if (eventoAtual) body.event_id = eventoAtual;

  const resp = await apiFetch('/api/admin/games', 'POST', body);

  if (resp.ok) {
    showToast(`"${resultado.nome}" cadastrado${eventoAtual ? ' e vinculado' : ' — vincule a um evento quando quiser'}!`, 'success');
    limparBusca();
    catalogoCache = null;
    await carregarCatalogo();
    if (eventoAtual) await carregarJogos();
    renderResultadosCatalogo();
  } else {
    const d = await resp.json();
    showToast(d.detail || 'Erro ao cadastrar jogo', 'error');
  }
}

async function criarJogoManual() {
  const nome        = document.getElementById('manual-nome').value.trim();
  const slugInput   = document.getElementById('manual-slug').value.trim();
  const plataforma  = document.getElementById('manual-plataforma').value.trim() || null;
  const scoreMaxRaw = document.getElementById('manual-score-max').value.trim();
  const scoreMax    = scoreMaxRaw ? parseInt(scoreMaxRaw, 10) : null;

  if (!nome) { showToast('Nome é obrigatório', 'error'); return; }
  const slug = slugInput || nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const body = { nome, slug, plataforma, score_max: scoreMax };
  if (eventoAtual) body.event_id = eventoAtual;

  const resp = await apiFetch('/api/admin/games', 'POST', body);

  if (resp.ok) {
    showToast(`"${nome}" cadastrado${eventoAtual ? ' e vinculado' : ''}!`, 'success');
    document.getElementById('manual-nome').value = '';
    document.getElementById('manual-slug').value = '';
    document.getElementById('manual-plataforma').value = '';
    document.getElementById('manual-score-max').value = '';
    catalogoCache = null;
    await carregarCatalogo();
    if (eventoAtual) await carregarJogos();
    renderResultadosCatalogo();
  } else {
    const d = await resp.json();
    showToast(d.detail || 'Erro ao cadastrar jogo', 'error');
  }
}
</script>
