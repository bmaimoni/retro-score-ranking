<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Score — Ranking ao Vivo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap">
  <style>
    /* ── Layout da página de ranking ── */
    .ranking-page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: var(--max-width-ranking);
      margin: 0 auto;
      padding: var(--space-lg) var(--space-xl);
    }

    /* ── Header ── */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-sm, 6px);
      color: rgba(255,255,255,0.7);
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 6px 12px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 8px;
    }
    .btn-back:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .ranking-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-bottom: var(--space-lg);
      border-bottom: var(--border-width) solid var(--color-border);
      margin-bottom: var(--space-lg);
      gap: var(--space-md);
    }

    .ranking-title {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--color-primary);
      line-height: 1.3;
      text-align: center;
      grid-column: 2;
    }

    .ranking-meta {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .ranking-meta-right {
      align-items: flex-end;
    }

    .meta-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .meta-value {
      font-family: var(--font-mono);
      font-size: var(--text-md);
      color: var(--color-text);
      font-weight: var(--weight-bold);
    }

    .jogo-metadado {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    .jogo-metadado:empty { display: none; }
    .jogo-metadado a {
      color: var(--color-secondary);
      text-decoration: none;
    }
    .jogo-metadado a:hover { text-decoration: underline; }

    /* ── Seletor de jogo ── */
    .game-tabs {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }

    .game-tab {
      padding: var(--space-sm) var(--space-md);
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-full);
      color: var(--color-text-muted);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
    }
    .game-tab:hover {
      border-color: var(--color-border-hover);
      color: var(--color-text);
    }
    .game-tab.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
      box-shadow: 0 0 16px calc(var(--glow-intensity) * 1px) var(--color-primary-glow);
    }

    /* ── Status de conexão SSE ── */
    .connection-status {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Grid do ranking ── */
    .ranking-grid {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
    }

    /* ── Card de jogador ── */
    .player-card {
      display: grid;
      grid-template-columns: 56px 72px 1fr auto;
      grid-template-rows: auto auto;
      align-items: center;
      gap: var(--space-sm) var(--space-md);
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      animation: slideUp var(--anim-slow) ease both;
      transition: border-color var(--anim-normal) ease;
    }
    .player-card:hover { border-color: var(--color-border-hover); }

    /* Destaque para novas entradas */
    .player-card.new-entry {
      animation: newEntry 1.5s ease both;
      border-color: var(--color-secondary);
    }

    /* Destaque pra "meu score" — chegou aqui via link de perfil.html */
    .player-card.destaque-proprio {
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 2px var(--color-secondary);
      animation: pulsoDestaque 1.8s ease-in-out 2;
    }
    @keyframes pulsoDestaque {
      0%, 100% { box-shadow: 0 0 0 2px var(--color-secondary); }
      50%      { box-shadow: 0 0 12px 4px var(--color-secondary); }
    }

    /* Pódio */
    .player-card.pos-1 {
      border-color: var(--color-gold);
      background: linear-gradient(135deg, rgba(255,215,0,0.06) 0%, var(--color-bg-surface) 100%);
    }
    .player-card.pos-2 {
      border-color: var(--color-silver);
      background: linear-gradient(135deg, rgba(192,192,192,0.04) 0%, var(--color-bg-surface) 100%);
    }
    .player-card.pos-3 {
      border-color: var(--color-bronze);
      background: linear-gradient(135deg, rgba(205,127,50,0.04) 0%, var(--color-bg-surface) 100%);
    }

    /* ── Posição ── */
    .player-pos {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px; height: 48px;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      flex-shrink: 0;
      background: var(--color-bg-surface2);
      color: var(--color-text-muted);
    }
    .player-pos.pos-1 { background: rgba(255,215,0,0.15);   color: var(--color-gold);   font-size: var(--text-lg); }
    .player-pos.pos-2 { background: rgba(192,192,192,0.12); color: var(--color-silver); font-size: var(--text-lg); }
    .player-pos.pos-3 { background: rgba(205,127,50,0.12);  color: var(--color-bronze); font-size: var(--text-lg); }

    /* ── Foto ── */
    .player-photo {
      width: var(--photo-size-tv);
      height: var(--photo-size-tv);
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: var(--border-width) solid var(--color-border);
      flex-shrink: 0;
      cursor: zoom-in;
      transition: opacity 0.15s;
    }
    .player-photo:hover { opacity: 0.85; }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.aberto { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      cursor: default;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }
    .lightbox-fechar {
      position: absolute;
      top: 20px; right: 24px;
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 20px;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    .player-photo-placeholder {
      width: var(--photo-size-tv);
      height: var(--photo-size-tv);
      border-radius: var(--radius-sm);
      background: var(--color-bg-surface2);
      border: var(--border-width) solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    /* ── Info do jogador ── */
    /* Histórico de recordes */
    .historico-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 2px 0 0;
      cursor: pointer;
      text-align: right;
      transition: color 0.2s;
      white-space: nowrap;
      display: block;
      width: 100%;
    }
    .historico-btn:hover { color: var(--color-primary); }
    .seguir-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm, 6px);
      color: var(--color-text-muted);
      font-size: 9px;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      margin-top: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .seguir-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .seguir-btn.seguindo { color: var(--color-secondary); border-color: var(--color-secondary); }
    .historico-painel {
      display: none;
      grid-column: 1 / -1;
      padding: 10px 4px 4px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .historico-painel.aberto { display: block; }
    .historico-linha {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 11px;
    }
    .historico-linha:last-child { border-bottom: none; }
    .historico-score {
      font-family: var(--font-mono, monospace);
      font-weight: 700;
      color: var(--color-primary);
      min-width: 80px;
      text-align: right;
    }
    .historico-data {
      color: rgba(255,255,255,0.35);
      font-size: 10px;
      flex: 1;
    }
    .historico-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.06em;
    }
    .historico-badge.atual   { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
    .historico-badge.superado { background: rgba(255,100,0,0.15); color: rgba(255,140,0,0.7); }
    .historico-badge.pendente { background: rgba(255,255,0,0.1); color: rgba(255,220,0,0.6); }
    .historico-vazio { color: rgba(255,255,255,0.25); font-size: 10px; text-align: center; padding: 8px 0; }

    .player-nome-real {
      font-size: clamp(9px, 1.1vw, 12px);
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .player-data {
      font-size: clamp(8px, 1vw, 11px);
      color: rgba(255,255,255,0.3);
      margin-top: 1px;
    }

    .player-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-nick {
      font-family: var(--font-body);
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.04em;
    }

    .player-time {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
    }

    /* ── Pontuação ── */
    .player-score {
      text-align: right;
      flex-shrink: 0;
    }

    .player-score-value {
      font-family: var(--font-mono);
      font-size: var(--score-size-tv);
      font-weight: var(--weight-bold);
      color: var(--color-accent);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .pos-1 .player-score-value { color: var(--color-gold); }
    .pos-2 .player-score-value { color: var(--color-silver); }
    .pos-3 .player-score-value { color: var(--color-bronze); }

    .player-score-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: right;
      margin-top: 2px;
    }

    /* ── Estado vazio ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      min-height: 300px;
      color: var(--color-text-muted);
      text-align: center;
      animation: fadeIn var(--anim-slow) ease both;
    }

    .empty-icon {
      font-size: 64px;
      line-height: 1;
      animation: pulse 3s ease-in-out infinite;
    }

    .empty-title {
      font-family: var(--font-display);
      font-size: var(--text-md);
      color: var(--color-text-dim);
      line-height: 1.5;
    }

    /* ── Barra inferior: QR + total ── */
    .ranking-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: var(--border-width) solid var(--color-border);
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    .footer-qr-hint {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .footer-url {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-secondary);
      letter-spacing: 0.04em;
    }

    .footer-hint {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .footer-count {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
    }

    /* ── Busca ── */
    .ranking-search-bar {
      margin-bottom: var(--space-lg);
    }
    .ranking-search-input {
      width: 100%;
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-sm, 6px);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      padding: var(--space-sm) var(--space-md);
      transition: border-color var(--transition);
    }
    .ranking-search-input::placeholder { color: var(--color-text-muted); }
    .ranking-search-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-primary-glow, transparent);
    }

    /* ── Paginação ── */
    .ranking-paginacao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
    }
    .pag-btn {
      background: var(--color-bg-surface);
      border: var(--border-width) solid var(--color-border);
      border-radius: var(--radius-sm, 6px);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      padding: var(--space-sm) var(--space-md);
      cursor: pointer;
      transition: all var(--transition);
    }
    .pag-btn:hover:not(:disabled) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .pag-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .pag-info {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
      min-width: 120px;
      text-align: center;
    }

    /* ── Responsividade para telas menores ── */
    @media (max-width: 768px) {
      .ranking-page { padding: var(--space-md); }
      .ranking-header { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .ranking-title { grid-column: 1; font-size: var(--text-md); }
      .ranking-meta-right { align-items: flex-start; }
      .player-card { grid-template-columns: 40px 56px 1fr auto; height: auto; padding: var(--space-sm); }
      .player-nick { font-size: var(--text-md); }
      --score-size-tv: var(--text-lg);
    }
  </style>
</head>
<body>

<div class="ranking-page">

  <!-- Header -->
  <header>
    <a href="index.html" class="btn-back" id="link-voltar">◂ VOLTAR</a>
    <div class="ranking-header">
      <div class="ranking-meta" style="flex-direction:row;align-items:center;gap:var(--space-sm)">
        <img id="jogo-capa" alt="" style="display:none;width:32px;height:32px;object-fit:cover;border-radius:var(--radius-sm);border:var(--border-width) solid var(--color-border)">
        <div style="display:flex;flex-direction:column;gap:var(--space-xs)">
          <span class="meta-label">Jogo atual</span>
          <span class="meta-value" id="jogo-nome">—</span>
          <span class="jogo-metadado" id="jogo-metadado"></span>
        </div>
      </div>

      <h1 class="ranking-title">HIGH<br>SCORES</h1>

      <div class="ranking-meta ranking-meta-right">
        <div class="connection-status">
          <div class="connection-dot" id="conn-dot"></div>
          <span id="conn-label">AO VIVO</span>
        </div>
      </div>
    </div>

    <!-- Tabs de jogos -->
    <div class="game-tabs" id="game-tabs" role="tablist">
      <span class="meta-label" style="align-self:center">Carregando...</span>
    </div>

    <!-- Busca -->
    <div class="ranking-search-bar">
      <input type="search" id="busca-input" class="ranking-search-input"
             placeholder="Buscar por nick, nome ou pontuação..." autocomplete="off"
             aria-label="Buscar no ranking">
    </div>
  </header>

  <!-- Lista do ranking -->
  <main>
    <div class="ranking-grid" id="ranking-grid" role="list">
      <!-- Preenchido via JS -->
    </div>

    <!-- Paginação -->
    <div class="ranking-paginacao" id="ranking-paginacao" style="display:none">
      <button id="pag-anterior" class="pag-btn" aria-label="Página anterior">‹ Anterior</button>
      <span id="pag-info" class="pag-info"></span>
      <button id="pag-proxima" class="pag-btn" aria-label="Próxima página">Próxima ›</button>
    </div>

    <div class="ranking-footer-qr">
      <div class="ranking-footer-qr-label">PARTICIPE PELO CELULAR</div>
      <a id="ranking-qr-link" href="https://retro-score-ranking.vercel.app/index.html" target="_blank" style="display:inline-block">
        <div class="ranking-footer-qr-box">
          <div id="ranking-qrcode"></div>
        </div>
      </a>
      <div class="ranking-footer-qr-url" id="ranking-qr-url"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="ranking-footer">
    <div class="footer-qr-hint">
      <a href="index.html" id="link-participar" style="color:var(--color-text-muted);text-decoration:none;font-size:var(--text-xs)">
        ▶ Participar
      </a>
    </div>
    <span class="footer-count" id="footer-count"></span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script type="module">
import { aplicarTema } from './temas.js';

// ── CONFIGURAÇÃO ──────────────────────────────────────────────────────────────
const API_URL      = 'https://retro-score-ranking-production.up.railway.app';
const UPLOAD_URL   = 'https://retro-score-ranking.vercel.app';

// Evento — opcional, SEM fallback (diferente de index.html). Ausente =
// comportamento de sempre (placar geral, sem filtro de evento) — nenhum
// QR/link já publicado quebra. Ver docs/MARCAS_SPEC.md §4.5.
const EVENTO_SLUG = new URLSearchParams(location.search).get('evento');
// id de entrada vindo de perfil.html ("ver no ranking") — navega até a
// página certa e destaca o card, uma única vez (docs/BACKLOG_2026.md §3.6).
const DESTAQUE_ID = new URLSearchParams(location.search).get('destaque');
let destaqueAplicado = false;

function buildRankingUrl(jogoSlug) {
  return EVENTO_SLUG
    ? `${API_URL}/api/e/${EVENTO_SLUG}/ranking/${jogoSlug}`
    : `${API_URL}/api/ranking/${jogoSlug}`;
}

function buildJogosUrl() {
  return EVENTO_SLUG
    ? `${API_URL}/api/e/${EVENTO_SLUG}/jogos`
    : `${API_URL}/api/jogos`;
}

// Delay entre animações de entrada (ms)
const STAGGER_DELAY = 60;

// Paginação e busca (client-side — volume esperado é dezenas/centenas de
// entradas por jogo, não justifica busca no backend ainda; ver EVENTOS_SPEC.md §5)
const PAGE_SIZE = 20;
let paginaAtual = 1;
let buscaQuery  = '';

// ── ESTADO ────────────────────────────────────────────────────────────────────
let jogoAtual = null;   // { id, nome, slug }
let entradas  = [];     // lista completa e não-filtrada do jogo atual
let sseSource = null;   // EventSource ativo
let usuarioAtual = null; // sessão de visitante (docs/SEGUIR_SPEC.md) — null = deslogado
let seguindoIds  = new Set(); // ids que o visitante logado já segue

// ── INICIALIZAÇÃO ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  // Preserva o contexto de evento ao navegar de volta pro index.html
  if (EVENTO_SLUG) {
    const hrefComEvento = `index.html?evento=${EVENTO_SLUG}`;
    document.getElementById('link-voltar').href = hrefComEvento;
    document.getElementById('link-participar').href = hrefComEvento;
  }
  await carregarSessaoESeguindo();
  gerarQR();  // não bloqueia — QR pode chegar um instante depois
  await carregarJogos();
  conectarControlesBuscaEPaginacao();
});

// ── QR Code ───────────────────────────────────────────────────────────────────
// Mesmo padrão de telao.html: aponta pro fluxo de envio, escopado pro
// evento atual quando há um (?evento=), senão cai no envio padrão da
// plataforma — nunca ficava vazio antes por falta de geração real.
// Em ranking agregado (modo_ranking != 'zerado'), não usa o evento da
// URL direto — pede ao backend qual é o evento mais recente/ativo da
// marca dona da página (docs/BACKLOG_2026.md §3 item 3.3), pra não
// apontar pro envio de um evento cuja janela já fechou.
async function gerarQR() {
  let slugAlvo = EVENTO_SLUG;
  if (EVENTO_SLUG) {
    try {
      const resp = await fetch(`${API_URL}/api/e/${EVENTO_SLUG}/evento-envio-atual`);
      if (resp.ok) slugAlvo = (await resp.json()).slug;
    } catch {}
  }
  const url = slugAlvo
    ? `${UPLOAD_URL}/index.html?evento=${slugAlvo}`
    : `${UPLOAD_URL}/index.html`;

  const el = document.getElementById('ranking-qrcode');
  el.innerHTML = '';
  new QRCode(el, {
    text: url,
    width: 120, height: 120,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
  document.getElementById('ranking-qr-link').href = url;
  document.getElementById('ranking-qr-url').textContent = url.replace(/^https?:\/\//, '');
}

function conectarControlesBuscaEPaginacao() {
  let buscaTimeout;
  document.getElementById('busca-input').addEventListener('input', (e) => {
    clearTimeout(buscaTimeout);
    buscaTimeout = setTimeout(() => {
      buscaQuery  = e.target.value;
      paginaAtual = 1;
      atualizarView();
    }, 200);
  });

  document.getElementById('pag-anterior').addEventListener('click', () => {
    if (paginaAtual <= 1) return;
    paginaAtual--;
    atualizarView();
    document.querySelector('.ranking-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('pag-proxima').addEventListener('click', () => {
    paginaAtual++;
    atualizarView();
    document.querySelector('.ranking-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

// ── JOGOS ─────────────────────────────────────────────────────────────────────
async function carregarJogos() {
  try {
    const resp = await fetch(buildJogosUrl());
    if (!resp.ok) throw new Error();
    const jogos = await resp.json();
    renderTabs(jogos);
    // Se vier com ?jogo=slug na URL, abre esse jogo direto
    const params  = new URLSearchParams(window.location.search);
    const slugUrl = params.get('jogo');
    const inicial = slugUrl
      ? jogos.find(j => j.slug === slugUrl) || jogos[0]
      : jogos[0];
    if (inicial) selecionarJogo(inicial);
  } catch {
    document.getElementById('game-tabs').innerHTML =
      '<span class="meta-label" style="color:var(--color-error)">Erro ao carregar jogos</span>';
  }
}

function renderTabs(jogos) {
  const container = document.getElementById('game-tabs');
  container.innerHTML = jogos.map(j => `
    <button class="game-tab" role="tab" data-slug="${j.slug}" data-id="${j.id}" data-nome="${j.nome}">
      ${j.nome}
    </button>
  `).join('');

  container.querySelectorAll('.game-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selecionarJogo({ id: tab.dataset.id, nome: tab.dataset.nome, slug: tab.dataset.slug });
    });
  });
}

async function selecionarJogo(jogo) {
  jogoAtual = jogo;

  // Reseta busca e página ao trocar de jogo
  buscaQuery = '';
  paginaAtual = 1;
  document.getElementById('busca-input').value = '';

  // Aplica tema do jogo
  aplicarTema(jogo.slug);
  // No ranking, usa contain em vez de auto 70vh para não esticar
  document.body.style.backgroundSize       = 'contain';
  document.body.style.backgroundPosition   = 'center top';

  // Atualiza tabs
  document.querySelectorAll('.game-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.slug === jogo.slug);
  });

  // Atualiza header
  document.getElementById('jogo-nome').textContent = jogo.nome;

  // Desconecta SSE anterior
  desconectarSSE();

  // Carrega snapshot + conecta SSE
  await carregarRanking(jogo);
  conectarSSE(jogo.slug);
}

// ── RANKING SNAPSHOT ──────────────────────────────────────────────────────────
async function carregarRanking(jogo) {
  renderLoading();
  try {
    const resp = await fetch(buildRankingUrl(jogo.slug));
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    entradas = data.entradas || [];
    renderJogoMetadado(data.jogo);
    aplicarDestaqueSeNecessario();
    atualizarView();
  } catch {
    renderErro();
  }
}

// Metadado opcional do jogo (docs/BACKLOG_2026.md §3.1) — plataforma,
// ano de lançamento e link de gameplay, quando o admin preencheu.
function renderJogoMetadado(jogo) {
  const el   = document.getElementById('jogo-metadado');
  const capa = document.getElementById('jogo-capa');
  if (!jogo) { el.innerHTML = ''; capa.style.display = 'none'; return; }

  if (jogo.capa_url) {
    capa.src = jogo.capa_url;
    capa.alt = `Capa de ${jogo.nome}`;
    capa.style.display = 'block';
  } else {
    capa.style.display = 'none';
  }

  const partes = [];
  if (jogo.plataforma) partes.push(escapar(jogo.plataforma));
  if (jogo.ano_lancamento) partes.push(String(jogo.ano_lancamento));
  let html = partes.join(' · ');
  if (jogo.gameplay_url) {
    html += `${html ? ' · ' : ''}<a href="${escapar(jogo.gameplay_url)}" target="_blank" rel="noopener">▶ gameplay</a>`;
  }
  el.innerHTML = html;
}

// Se veio de perfil.html com ?destaque=<entrada_id>, pula pra página onde
// aquela entrada está — só na primeira carga do jogo certo, não a cada
// atualização de SSE (senão "puxaria" quem já está navegando de volta).
function aplicarDestaqueSeNecessario() {
  if (!DESTAQUE_ID || destaqueAplicado) return;
  const idx = entradas.findIndex(e => e.id === DESTAQUE_ID);
  if (idx === -1) return;
  destaqueAplicado = true;
  paginaAtual = Math.floor(idx / PAGE_SIZE) + 1;
  setTimeout(() => {
    const card = document.querySelector(`.player-card[data-entrada-id="${DESTAQUE_ID}"]`);
    if (!card) return;
    card.classList.add('destaque-proprio');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 250);
}

// ── SSE ───────────────────────────────────────────────────────────────────────
function conectarSSE(slug) {
  sseSource = new EventSource(`${API_URL}/api/events/ranking/${slug}`);

  sseSource.addEventListener('novo_registro', e => {
    const nova = JSON.parse(e.data);

    // O SSE é por jogo, não por evento (o backend não sabe filtrar por
    // evento nesse canal) — se a página está escopada por evento, mesclar
    // a entrada direto no cliente poderia mostrar um score de OUTRO
    // evento. Mais seguro: revalida buscando do servidor, que já filtra
    // certo. Sem ?evento=, mantém o merge otimista de sempre.
    if (EVENTO_SLUG) {
      carregarRanking(jogoAtual);
      return;
    }

    // Remove entrada anterior do mesmo nick se existir
    entradas = entradas.filter(en => en.nick.toLowerCase().trim() !== nova.nick.toLowerCase().trim());
    entradas.push(nova);
    entradas.sort((a, b) => b.pontuacao - a.pontuacao);
    // Mantém a página em que a pessoa está — um score novo não deve
    // "puxar" quem está navegando de volta pra página 1
    atualizarView(nova.id);
  });

  sseSource.addEventListener('ocultar', e => {
    if (EVENTO_SLUG) { carregarRanking(jogoAtual); return; }
    const { id } = JSON.parse(e.data);
    entradas = entradas.filter(en => en.id !== id);
    atualizarView();
  });

  sseSource.addEventListener('reativar', e => {
    if (EVENTO_SLUG) { carregarRanking(jogoAtual); return; }
    const { entrada } = JSON.parse(e.data);
    entradas = entradas.filter(en => en.id !== entrada.id);
    entradas.push(entrada);
    entradas.sort((a, b) => b.pontuacao - a.pontuacao);
    atualizarView(entrada.id);
  });

  sseSource.onopen = () => setConexao(true);
  sseSource.onerror = () => {
    setConexao(false);
    // Tenta reconectar a cada 5s
    setTimeout(() => {
      if (jogoAtual) conectarSSE(jogoAtual.slug);
    }, 5000);
  };
}

function desconectarSSE() {
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  setConexao(false);
}

function setConexao(online) {
  const dot   = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  dot.classList.toggle('disconnected', !online);
  label.textContent = online ? 'AO VIVO' : 'RECONECTANDO...';
}

// ── FILTRO + PAGINAÇÃO ──────────────────────────────────────────────────────────
function filtrarEntradas(lista, query) {
  if (!query.trim()) return lista;
  const q = query.toLowerCase().trim();
  return lista.filter(e =>
    e.nick.toLowerCase().includes(q) ||
    (e.nome && e.nome.toLowerCase().includes(q)) ||
    String(e.pontuacao).includes(q)
  );
}

function atualizarView(novaEntradaId = null) {
  if (entradas.length === 0) {
    renderVazio();
    document.getElementById('footer-count').textContent = '';
    document.getElementById('ranking-paginacao').style.display = 'none';
    return;
  }

  const filtradas = filtrarEntradas(entradas, buscaQuery);

  if (filtradas.length === 0) {
    renderSemResultado();
    document.getElementById('footer-count').textContent = '0 resultados para a busca';
    document.getElementById('ranking-paginacao').style.display = 'none';
    return;
  }

  const totalPaginas = Math.max(1, Math.ceil(filtradas.length / PAGE_SIZE));
  if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
  const offset = (paginaAtual - 1) * PAGE_SIZE;
  const pagina = filtradas.slice(offset, offset + PAGE_SIZE);

  renderRanking(pagina, novaEntradaId, offset);
  renderPaginacao(totalPaginas, filtradas.length);

  const count = document.getElementById('footer-count');
  count.textContent = buscaQuery.trim()
    ? `${filtradas.length} de ${entradas.length} participante${entradas.length !== 1 ? 's' : ''}`
    : `${entradas.length} participante${entradas.length !== 1 ? 's' : ''}`;
}

function renderPaginacao(totalPaginas, totalFiltrado) {
  const container = document.getElementById('ranking-paginacao');
  if (totalFiltrado <= PAGE_SIZE) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  document.getElementById('pag-info').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
  document.getElementById('pag-anterior').disabled = paginaAtual <= 1;
  document.getElementById('pag-proxima').disabled  = paginaAtual >= totalPaginas;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderRanking(lista, novaEntradaId = null, offset = 0) {
  const grid = document.getElementById('ranking-grid');

  grid.innerHTML = lista.map((entry, i) => {
    const pos     = offset + i + 1;
    const posClass = pos <= 3 ? `pos-${pos}` : '';
    const posLabel = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : pos;
    const isNew    = entry.id === novaEntradaId;
    const delay    = isNew ? 0 : i * STAGGER_DELAY;
    const foto     = entry.foto_url
      ? `<img class="player-photo" src="${entry.foto_url}" alt="Foto de ${entry.nick}" loading="lazy" onclick="abrirLightbox('${entry.foto_url}')">`
      : `<div class="player-photo-placeholder">${entry.nick.charAt(0).toUpperCase()}</div>`;

    return `
      <div class="player-card ${posClass} ${isNew ? 'new-entry' : ''}"
           role="listitem"
           data-entrada-id="${entry.id}"
           style="animation-delay: ${delay}ms">
        <div class="player-pos ${posClass}">${posLabel}</div>
        ${foto}
        <div class="player-info">
          <span class="player-nick">${escapar(entry.nick)}</span>
          ${entry.nome ? `<span class="player-nome-real">${escapar(entry.nome)}</span>` : ''}
          <span class="player-data">${entry.criado_em ? new Date(entry.criado_em).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : tempoRelativo(entry.criado_em)}</span>
        </div>
        <div class="player-score">
          <div class="player-score-value">${entry.pontuacao.toLocaleString('pt-BR')}</div>
          <div class="player-score-label">pts</div>
          <button class="historico-btn" onclick="toggleHistorico(this, '${jogoAtual.slug}', '${escapar(entry.nick)}')">▾ histórico</button>
          ${botaoSeguirHtml(entry)}
        </div>
        <div class="historico-painel"></div>
      </div>
    `;
  }).join('');
}

// ── SEGUIR (docs/SEGUIR_SPEC.md) ────────────────────────────────────────────
// entry.user_id só existe pra quem enviou o score logado — placar
// anônimo não tem conta pra seguir. Visibilidade cross-marca é
// aceitável (decisão #7): é o mesmo dado de ranking já público.

async function carregarSessaoESeguindo() {
  try {
    const respSessao = await fetch(`${API_URL}/api/auth/session`, { credentials: 'include' });
    if (!respSessao.ok) return;
    usuarioAtual = await respSessao.json();

    const respSeguindo = await fetch(`${API_URL}/api/perfil/seguindo`, { credentials: 'include' });
    if (respSeguindo.ok) {
      const seguindo = await respSeguindo.json();
      seguindoIds = new Set(seguindo.map(s => s.id));
    }
  } catch { /* segue deslogado, sem quebrar a página */ }
}

function botaoSeguirHtml(entry) {
  if (!usuarioAtual || !entry.user_id || entry.user_id === usuarioAtual.id) return '';
  const jaSegue = seguindoIds.has(entry.user_id);
  return `
    <button class="seguir-btn ${jaSegue ? 'seguindo' : ''}" data-user-id="${entry.user_id}"
            onclick="toggleSeguir(this)">
      ${jaSegue ? '✓ seguindo' : '+ seguir'}
    </button>
  `;
}

window.toggleSeguir = async function(btn) {
  const userId  = btn.dataset.userId;
  const jaSegue = seguindoIds.has(userId);
  const path = jaSegue ? `/api/perfil/seguir/${userId}/cancelar` : `/api/perfil/seguir/${userId}`;

  try {
    const resp = await fetch(`${API_URL}${path}`, { method: 'POST', credentials: 'include' });
    if (!resp.ok) { showToast('Não foi possível atualizar agora', 'error'); return; }

    if (jaSegue) {
      seguindoIds.delete(userId);
      btn.classList.remove('seguindo');
      btn.textContent = '+ seguir';
      showToast('Deixou de seguir', 'success');
    } else {
      seguindoIds.add(userId);
      btn.classList.add('seguindo');
      btn.textContent = '✓ seguindo';
      showToast('Agora você segue esse jogador!', 'success');
    }
  } catch {
    showToast('Erro ao atualizar', 'error');
  }
};

function showToast(msg, tipo = 'success') {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.className = `toast ${tipo} show`;
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

function renderLoading() {
  document.getElementById('ranking-grid').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon" style="animation:blink 1s step-end infinite">▋</div>
      <p class="empty-title">CARREGANDO...</p>
    </div>
  `;
}

function renderVazio() {
  document.getElementById('ranking-grid').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">👾</div>
      <p class="empty-title">NENHUM SCORE<br>AINDA</p>
      <p class="meta-label">Seja o primeiro a jogar!</p>
    </div>
  `;
}

function renderSemResultado() {
  document.getElementById('ranking-grid').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <p class="empty-title">NENHUM RESULTADO<br>PARA A BUSCA</p>
      <p class="meta-label">Tente outro nick, nome ou pontuação</p>
    </div>
  `;
}

function renderErro() {
  document.getElementById('ranking-grid').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <p class="empty-title" style="color:var(--color-error)">ERRO DE CONEXÃO</p>
      <p class="meta-label">Verifique a conexão com o servidor</p>
    </div>
  `;
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
// ── HISTÓRICO DE RECORDES ────────────────────────────────────
const _historicoCache = {};

window.toggleHistorico = async function(btn, slug, nick) {
  // painel é o .historico-painel — irmão do .player-score (pai do btn)
  const scoreDiv = btn.closest('.player-score') || btn.parentElement;
  const painel   = scoreDiv.parentElement.querySelector('.historico-painel');
  const aberto   = painel.classList.toggle('aberto');

  btn.textContent = aberto ? '▴ fechar' : '▾ histórico';

  if (!aberto) return;

  // Já carregou
  if (painel.dataset.loaded) return;
  painel.innerHTML = '<div class="historico-vazio">carregando...</div>';

  const chave = `${slug}:${nick.toLowerCase()}`;
  try {
    if (!_historicoCache[chave]) {
      const resp = await fetch(`${API_URL}/api/ranking/${slug}/historico/${encodeURIComponent(nick)}`);
      if (!resp.ok) throw new Error();
      const data = await resp.json();
      _historicoCache[chave] = data.historico || [];
    }

    const historico = _historicoCache[chave];
    if (!historico.length) {
      painel.innerHTML = '<div class="historico-vazio">sem histórico disponível</div>';
    } else {
      painel.innerHTML = historico.map((h, i) => {
        const badge = h.pendente
          ? '<span class="historico-badge pendente">EM ANÁLISE</span>'
          : h.superado || i > 0
            ? '<span class="historico-badge superado">SUPERADO</span>'
            : '<span class="historico-badge atual">ATUAL</span>';
        const data = h.criado_em
          ? new Date(h.criado_em).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})
          : '';
        return `
          <div class="historico-linha">
            <span class="historico-score">${Number(h.pontuacao).toLocaleString('pt-BR')}</span>
            <span class="historico-data">${data}</span>
            ${badge}
          </div>`;
      }).join('');
    }
    painel.dataset.loaded = '1';
  } catch {
    painel.innerHTML = '<div class="historico-vazio">erro ao carregar histórico</div>';
  }
};

function tempoRelativo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000)  return 'agora mesmo';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}min atrás`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h atrás`;
  return `${Math.floor(diff / 86400000)}d atrás`;
}

function escapar(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

window.abrirLightbox = function(url) {
  const lb  = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = url;
  lb.classList.add('aberto');
  document.body.style.overflow = 'hidden';
};
window.fecharLightbox = function(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('lightbox-fechar')) return;
  document.getElementById('lightbox').classList.remove('aberto');
  document.getElementById('lightbox-img').src = '';
  document.body.style.overflow = '';
};
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') window.fecharLightbox();
});
</script>

  <button class="lightbox-fechar" onclick="fecharLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="Foto ampliada">
</div>
<div class="toast" id="toast"></div>
